<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--bg:#f4f6fb;--surface:#fff;--surface-2:#f8fafc;--text:#0f172a;--text-2:#475569;--text-3:#94a3b8;--line:#e2e8f0;--accent:#4f46e5;--accent-soft:#eef2ff;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 10% -10%,#e0e7ff 0,transparent 45%),radial-gradient(1000px 500px at 110% 0%,#fce7f3 0,transparent 40%),var(--bg);-webkit-font-smoothing:antialiased}
.page{width:1440px;height:1000px;padding:34px 120px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:14px}.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#8b7cf6,#5b54e8);color:#fff;font-weight:800;font-size:23px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(79,70,229,.28)}
.brand-title{font-size:20px;font-weight:700}.brand-sub{font-size:12px;color:var(--text-3);margin-top:3px}
.nav{display:flex;gap:34px;font-size:15px;color:var(--text-2)}.nav .on{color:var(--accent);font-weight:600}
.mode-bar{display:inline-flex;gap:2px;background:#f1f5f9;border-radius:14px;padding:4px;margin-bottom:18px}
.mode-pill{border:0;background:transparent;color:var(--text-2);font-size:14px;font-weight:600;padding:10px 22px;border-radius:11px}
.mode-pill.active{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.08)}
.layout{display:grid;grid-template-columns:1fr 390px;gap:28px;align-items:start}
.card{background:var(--surface);border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 16px 40px rgba(15,23,42,.06);padding:26px 30px}
.card-title{font-size:20px;font-weight:700;margin:0 0 8px}.card-sub{font-size:13px;color:var(--text-2);margin:0 0 18px;line-height:1.6}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;color:var(--text-2);font-weight:600;margin-bottom:6px}
.input,.select{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;color:var(--text)}
.select::after{content:"⌄";color:var(--text-3);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.5}
.btn{height:46px;border:0;border-radius:10px;background:linear-gradient(180deg,#6d63f0,#4f46e5);color:#fff;font-size:14px;font-weight:600;width:100%;margin-top:18px;box-shadow:0 8px 20px rgba(79,70,229,.25)}
.footer-note{text-align:center;font-size:12px;color:var(--text-3);margin-top:10px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.photo-thumb{height:96px;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--line)}
.photo-thumb:nth-child(1){background:linear-gradient(135deg,#fbcfe8,#e0e7ff)}.photo-thumb:nth-child(2){background:linear-gradient(135deg,#bbf7d0,#a7f3d0)}.photo-thumb:nth-child(3){background:linear-gradient(135deg,#fde68a,#fecaca)}.photo-thumb:nth-child(4){background:linear-gradient(135deg,#bfdbfe,#c7d2fe)}
.photo-thumb .x{position:absolute;right:6px;top:5px;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.8);font-size:13px;text-align:center;line-height:20px;color:#64748b}
.photo-thumb .cap{position:absolute;left:8px;bottom:6px;font-size:10px;color:rgba(15,23,42,.55)}
.add{height:42px;border:1.5px dashed #cbd5e1;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:13px;background:#fafbfe}
.preview-stage{background:#eef1f6;border-radius:14px;padding:18px;display:flex;justify-content:center;margin-top:18px}
.photo-paper{width:330px;aspect-ratio:102/152;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.16);padding:8px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px}
.photo-paper div{border-radius:2px}
.photo-paper div:nth-child(1){background:linear-gradient(135deg,#fbcfe8,#e0e7ff)}.photo-paper div:nth-child(2){background:linear-gradient(135deg,#bbf7d0,#a7f3d0)}.photo-paper div:nth-child(3){background:linear-gradient(135deg,#fde68a,#fecaca)}.photo-paper div:nth-child(4){background:linear-gradient(135deg,#bfdbfe,#c7d2fe)}
.section-title{font-size:13px;font-weight:700;color:var(--text-2);margin:22px 0 10px}
.pdf-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.pdf-icon{width:42px;height:42px;border-radius:10px;background:#eef2ff;color:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.pdf-name{font-size:14px;font-weight:600}.pdf-meta{font-size:11px;color:var(--text-3);margin-top:3px}
.book-preview{display:flex;gap:18px;margin-top:18px}
.sheet{width:300px;aspect-ratio:297/210;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.14);display:flex;padding:10px;gap:8px;position:relative}
.sheet .side{flex:1;border:1px solid #eef2f7;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px}
.sheet .cap{position:absolute;bottom:-20px;width:100%;text-align:center;font-size:10px;color:#94a3b8}
.toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--text-2);margin:12px 0}
.toggle{width:42px;height:24px;border-radius:999px;background:var(--accent);position:relative}.toggle::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;right:2px;top:2px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.info{font-size:12px;color:var(--text-3);background:#f8fafc;border-radius:10px;padding:11px 12px;line-height:1.6;margin-top:10px}
</style></head><body><div class="page"><div class="header"><div class="brand"><div class="logo">P</div><div><div class="brand-title">Print Portal</div><div class="brand-sub">局域网打印门户</div></div></div><div class="nav"><span class="on">打印</span><span>扫描</span><span>管理</span><span>新窗口</span></div></div><div class="mode-bar"><button class="mode-pill">普通文档</button><button class="mode-pill">身份证</button><button class="mode-pill">发票</button><button class="mode-pill active">图片打印</button><button class="mode-pill">书籍打印</button></div>
<div class="layout">
<section class="card"><h2 class="card-title">图片打印</h2><p class="card-sub">一次选择多张图片，按纸张和每张张数自动排版。</p>
<div class="photos">
 <div class="photo-thumb"><span class="x">×</span><span class="cap">海边.jpg</span></div>
 <div class="photo-thumb"><span class="x">×</span><span class="cap">合影.jpg</span></div>
 <div class="photo-thumb"><span class="x">×</span><span class="cap">风景.jpg</span></div>
 <div class="photo-thumb"><span class="x">×</span><span class="cap">宠物.jpg</span></div>
</div><div class="add">＋ 添加图片（JPG / PNG / WebP，可多选）</div>
<div class="section-title">打印预览</div><div class="preview-stage"><div class="photo-paper"><div></div><div></div><div></div><div></div></div></div>
</section>
<section class="card"><h2 class="card-title">图片设置</h2><p class="card-sub">纸张和排版参数由打印机 PPD 能力驱动。</p>
<div class="field"><label>打印机</label><div class="select">EPSON ET-1110（默认）</div></div>
<div class="field"><label>纸张</label><div class="select">6寸（4R，102 × 152 mm）</div></div>
<div class="grid2"><div class="field"><label>每张纸</label><div class="select">4 张</div></div><div class="field"><label>排列方式</label><div class="select">自动网格</div></div></div>
<div class="grid2"><div class="field"><label>图片缩放</label><div class="select">适应</div></div><div class="field"><label>份数</label><div class="input">1</div></div></div>
<div class="field"><label>边距</label><div class="select">无边框</div><div class="hint">无边框需要打印机 PPD 支持</div></div>
<div class="toggle-row"><span>显示裁剪线</span><span class="toggle"></span></div>
<button class="btn">打印 4 张图片</button><div class="footer-note">将输出 1 张 6寸照片纸</div>
</section></div></div></body></html>
