services:
  print-portal:
    # ghcr.io is frequently unreachable from mainland NAS hosts, so the default
    # pulls through the Nanjing University mirror. Override PRINT_PORTAL_IMAGE
    # to use another registry, e.g. ghcr.io/frankevil/print-portal:0.3.0
    image: ${PRINT_PORTAL_IMAGE:-ghcr.nju.edu.cn/frankevil/print-portal:${VERSION}}
    container_name: print-portal
    network_mode: host
    privileged: true
    volumes:
      - ${TRIM_PKGVAR:?}/data:/app/data
      - ${TRIM_PKGVAR:?}/cups-etc:/etc/cups
      - ${TRIM_PKGVAR:?}/cups-spool:/var/spool/cups
      - ${TRIM_PKGVAR:?}/cups-log:/var/log/cups
      - /dev/bus/usb:/dev/bus/usb
      - /vol1:/vol1:ro
      - /vol2:/vol2:ro
      - ${TRIM_APPDEST:?}:/run/print-portal
    environment:
      - TZ=Asia/Shanghai
      - PRINT_PORTAL_AUTH_MODE=fnos
      - PRINTD_SOCKET=/run/print-portal/app.sock
      - PRINT_PORTAL_APP_NAME=print-portal
      - PRINT_PORTAL_NAS_ROOTS=/vol1,/vol2
      - PRINTD_ADDR=127.0.0.1:8088
      - CUPS_SERVER=127.0.0.1:631
      - PRINT_PORTAL_IPP_ADDR=0.0.0.0:8631
    restart: unless-stopped
