# 普通 Docker / 非 fnOS 版本：使用预构建镜像，Token 登录
services:
  print-portal:
    image: ghcr.io/frankevil/print-portal:0.4.5
    container_name: print-portal
    restart: unless-stopped
    privileged: true
    ports:
      - "${PRINT_PORTAL_PUBLIC_HOST:-0.0.0.0}:8088:8088"
      - "${PRINT_PORTAL_PUBLIC_HOST:-0.0.0.0}:8631:8631"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - print-data:/app/data
      - cups-etc:/etc/cups
      - cups-spool:/var/spool/cups
      - cups-log:/var/log/cups
    environment:
      PRINT_PORTAL_AUTH_MODE: "token"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}"
      PRINT_PORTAL_PUBLIC_HOST: "${PRINT_PORTAL_PUBLIC_HOST:-}"
      PRINT_PORTAL_VERSION: "0.4.5"
      PRINTD_ADDR: ":8088"
      CUPS_SERVER: "127.0.0.1:631"
      PRINT_PORTAL_IPP_ADDR: "0.0.0.0:8631"

volumes:
  print-data:
  cups-etc:
  cups-spool:
  cups-log:
