services:
  print-portal:
    build:
      context: .
      dockerfile: deployments/Dockerfile.fnos
    container_name: print-portal
    restart: unless-stopped
    network_mode: host
    expose:
      - "8088"
      - "8631"
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./data:/app/data
      - ./cups-etc:/etc/cups
      - ./cups-spool:/var/spool/cups
      - ./cups-log:/var/log/cups
    environment:
      PRINT_PORTAL_AUTH_MODE: "token"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}"
      PRINTD_ADDR: "127.0.0.1:8088"
      CUPS_SERVER: "127.0.0.1:631"
      PRINT_PORTAL_IPP_ADDR: "192.168.2.30:8631"

  web-proxy:
    image: nginx:latest
    container_name: print-portal-web-proxy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - print-portal
    volumes:
      - ./deployments/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
